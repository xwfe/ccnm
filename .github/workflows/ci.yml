# Format, lint and the whole test suite, on every push and pull request:
# the Rust tests, then the plan and protocol checks and the Python suite
# (scripts/ci_gates.py, P53). Until P53 only the Rust half ran here, so a
# green run said nothing about the neutral clients or the contracts
# (C51-03).
#
# Two platform jobs, because ccnm has two halves that do not run in the same
# places. The **Agent** half (Controller, sessions) is a launchd
# LaunchAgent that asks `launchctl` and `security` directly -- macOS only,
# and that is a property of the program, not a gap in the CI. The
# **Runtime** half (`internal mcp-serve` and the seven tools) runs on
# Linux too, and P12 proved it on a real Debian 13 / x86_64 machine.
#
# So the Linux job is a Runtime gate. A green one means the code builds
# and its tests pass on Linux; it does **not** mean the Agent half is
# supported there, and nothing in docs/support-matrix.md should start
# saying so because this job went green.
#
# The windows-runtime job is the same kind of gate for Windows as a
# project machine, which is being built a stage at a time since P107 and
# is narrower still; its own comment says how much a green one proves.
#
# A third job, msrv, only compiles, on the rust-version Cargo.toml declares.
# Everything else runs on stable, where a std API newer than that
# declaration stays green. ccnm, gld and toexec keep the same rust-version
# (toexec docs/plan/implementation-plan-v2.md, section 11).
#
# Only first-party actions are used (actions/checkout, actions/cache,
# actions/upload-artifact).
# Every third-party action is a supply-chain dependency that runs with a
# token in a repository whose whole point is being careful about what runs
# where; caching by hand is a few lines and no trust.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failing build should not also cost a minute of backtrace-less guessing.
  RUST_BACKTRACE: 1

jobs:
  test:
    # macos-latest is arm64 today; nothing here depends on the arch.
    runs-on: macos-latest
    # The Python gate drives real processes; a hung one would otherwise hold
    # the runner for GitHub's default of six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      # `search_text` shells out to ripgrep, and its tests search a real
      # workspace, so without this they fail on a missing dependency
      # rather than on anything about ccnm. tmux is only needed by
      # interactive sessions, which no test starts -- it is here so
      # `tmux::locate` is exercised against a machine that has one.
      - name: Install what the tools shell out to
        run: brew install ripgrep tmux

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The script builds the CLI itself and hands that path to the
      # neutral-client tests, so a binary the cache above restored is never
      # what they drive, and a test class that finds no binary cannot skip
      # itself green: any skip fails the gate. The same command a developer
      # runs (docs/development.md).
      - name: Plan, protocol and Python gates
        run: python3 scripts/ci_gates.py

      # The one thing a release must not get wrong: a binary that cannot
      # say what it is. Cheap here, expensive to find out from a tarball.
      - name: The binary runs and reports its version
        run: |
          cargo build --release
          ./target/release/ccnm --version
          ./target/release/ccnm doctor --config tests/fixtures/config-valid.toml || true

  linux-runtime:
    # Pinned rather than `ubuntu-latest`, and the same image the release
    # artifact is built on: a gate that runs somewhere other than where
    # the download is produced is not a gate on the download.
    runs-on: ubuntu-24.04
    # A normal run takes about 4 minutes. Without this a hung test holds the
    # runner for GitHub's default of six hours and says nothing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version && cargo --version

      - name: Install what the tools shell out to
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep tmux

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # No `cargo fmt` here -- formatting is identical on every platform
      # and the macOS job already checks it. clippy and the tests are not
      # identical: the defect P12 found (a timeout that killed only the
      # process leader, because dash forks where bash execs) was green on
      # macOS and 10 seconds late on Linux, five times out of five.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The failure goes into the job summary *and* an annotation, not just
      # the log. Reading a job log needs a token; an annotation comes back
      # from the public check-runs API and shows on the commit page. So
      # "which test went red on Linux" is answerable without a gh login --
      # which matters exactly when a red Linux job is the only thing
      # standing between you and a release. `cargo test` is fail-fast, so
      # the tail is the useful part.
      #
      # A hang is not a failure until something ends it, so the tests get
      # 10 minutes (a normal Test step takes 2 to 3). libtest prints "test
      # <name> has been running for over 60 seconds" while it waits, which
      # puts the stuck test's name in the tail and so in the annotation. `timeout` signals its whole process
      # group, the test binary included, and exits 124.
      - name: Test
        run: |
          set -o pipefail
          if ! timeout --signal=INT --kill-after=30s 10m cargo test --workspace 2>&1 | tee /tmp/test.log; then
            {
              echo '### `cargo test --workspace` failed on Linux'
              echo
              echo '```'
              tail -n 60 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # An annotation is one line: %0A is how a newline survives.
            msg=$(tail -n 40 /tmp/test.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=cargo test --workspace failed::${msg}"
            exit 1
          fi

      # Here too, not only on macOS: the neutral clients drive a real
      # Runtime, and Linux is where the Runtime usually runs. The script
      # annotates its own failures; `timeout` does for a hang what it does
      # for the Rust tests above.
      - name: Plan, protocol and Python gates
        run: timeout --signal=INT --kill-after=30s 10m python3 scripts/ci_gates.py

      # The Linux download is built by this script; a release is a bad
      # place to find out it does not run.
      - name: The release artifact builds and reports its version
        run: |
          bash scripts/dist-linux.sh
          dist/ccnm --version

  windows-runtime:
    # Windows as the project machine, being built a stage at a time
    # (P107–P112, docs/plan/windows-runtime.md). A green job means the
    # library and the binary build there, the unit tests already written for
    # Windows pass, the gate refuses what Windows does not run yet, the read
    # tools work (P108), apply_patch and the write guard do (P109), and
    # running commands does (P110) -- nothing more: this is CI, not the real
    # machine (P112), and docs/support-matrix.md does not move because this
    # job went green.
    runs-on: windows-latest
    timeout-minutes: 45
    # sed and the rest are not in the runner's default pwsh; its Git Bash
    # is, and keeps the steps written the way the other jobs write them.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version && cargo --version

      # search_text runs ripgrep, as on the other two; the image has git
      # but no rg. Chocolatey is on the image already.
      - name: Install what the tools shell out to
        run: |
          choco install ripgrep -y --no-progress
          rg --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The library and the binary only. Most test code still assumes
      # Unix (`sh` scripts, mode bits) and is compiled out here; each
      # stage that brings a tool to Windows brings its tests with it.
      - name: Clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings

      # The modules whose tests already run on Windows. A stage that ports
      # one adds it here; docs/development.md says how.
      - name: Unit tests written for Windows
        run: |
          cargo test -p ccnm-core --lib -- ssh:: protocol:: error:: lang:: \
            platform:: paths::remote:: mcp::path:: mcp::search::hit_paths:: safety::whoami:: \
            mcp::write_guard:: mcp::patch::

      - name: What Windows refuses, and what it lets through
        run: cargo test -p ccnm-cli --test windows_gate

      # The seven read tools through the real binary (P108.2), the names
      # NTFS reads as another file refused by them, and a coding session
      # that writes (P109).
      - name: The read tools, end to end
        run: cargo test -p ccnm-cli --test read_tools

      # Two Runtime processes on one working tree, and what the Runtime says
      # about its own guard while one holds it (P109.3).
      - name: The write guard between real processes
        run: cargo test -p ccnm-cli --test write_guard

      # Programs found the Windows way, shell in Git Bash, timeouts ending
      # the tree, background commands, a killed server's channel closing,
      # and an MCP server behind a .cmd (P110). Node and Git Bash are on the
      # image.
      - name: Running commands
        run: cargo test -p ccnm-cli --test windows_exec -- --nocapture --test-threads=1

      - name: The binary builds and reports its version
        run: |
          cargo build --release -p ccnm-cli
          ./target/release/ccnm.exe --version

      # The real-machine checks (P108.4 onward) run this very build on the
      # Win11 test machine: nothing here can link for Windows locally, and a
      # binary built some other way is not the one this job vouched for.
      - name: Keep the binary for the real-machine check
        uses: actions/upload-artifact@v4
        with:
          name: ccnm-windows-x86_64
          path: target/release/ccnm.exe
          retention-days: 7
          if-no-files-found: error

  msrv:
    # Linux on purpose: the one item compiled for one OS only is the
    # subreaper in mcp::orphans (P84), with its Linux-only `nix`
    # dependency, and this is where it compiles. Its other branch is a
    # stub that does nothing. The `cfg(unix)` items P107 added compile
    # here too; their `cfg(windows)` twins compile in the windows-runtime
    # job, on stable only. Add a real macOS-only item or dependency and
    # this needs a macOS run too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Read, not repeated here: when the three repositories bump
      # rust-version together, this job cannot be left testing the old one.
      - name: Install the toolchain Cargo.toml declares
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          case "$msrv" in
            ''|*[!0-9.]*)
              echo "::error::expected exactly one rust-version = \"x.y\" line in Cargo.toml, got: $msrv"
              exit 1 ;;
          esac
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      # A key of its own: stable's target/ is of no use to another rustc
      # and would only grow both caches.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-msrv-${{ runner.os }}-

      # toexec is a git dependency over https; the repository is public, so
      # this needs no token.
      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets --locked
