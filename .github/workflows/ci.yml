# Format, lint and the whole test suite, on every push and pull request.
#
# Two platform jobs, because ccnm has two halves that do not run in the same
# places. The **Agent** half (Controller, sessions) is a launchd
# LaunchAgent that asks `launchctl` and `security` directly -- macOS only,
# and that is a property of the program, not a gap in the CI. The
# **Runtime** half (`internal mcp-serve` and the seven tools) runs on
# Linux too, and P12 proved it on a real Debian 13 / x86_64 machine.
#
# So the Linux job is a Runtime gate. A green one means the code builds
# and its tests pass on Linux; it does **not** mean the Agent half is
# supported there, and nothing in docs/support-matrix.md should start
# saying so because this job went green.
#
# A third job, msrv, only compiles, on the rust-version Cargo.toml declares.
# Everything else runs on stable, where a std API newer than that
# declaration stays green. ccnm, gld and toexec keep the same rust-version
# (toexec docs/plan/implementation-plan-v2.md, section 11).
#
# Only first-party actions are used (actions/checkout, actions/cache).
# Every third-party action is a supply-chain dependency that runs with a
# token in a repository whose whole point is being careful about what runs
# where; caching by hand is a few lines and no trust.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failing build should not also cost a minute of backtrace-less guessing.
  RUST_BACKTRACE: 1

jobs:
  test:
    # macos-latest is arm64 today; nothing here depends on the arch.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      # `search_text` shells out to ripgrep, and its tests search a real
      # workspace, so without this they fail on a missing dependency
      # rather than on anything about ccnm. tmux is only needed by
      # interactive sessions, which no test starts -- it is here so
      # `tmux::locate` is exercised against a machine that has one.
      - name: Install what the tools shell out to
        run: brew install ripgrep tmux

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The one thing a release must not get wrong: a binary that cannot
      # say what it is. Cheap here, expensive to find out from a tarball.
      - name: The binary runs and reports its version
        run: |
          cargo build --release
          ./target/release/ccnm --version
          ./target/release/ccnm doctor --config tests/fixtures/config-valid.toml || true

  linux-runtime:
    # Pinned rather than `ubuntu-latest`, and the same image the release
    # artifact is built on: a gate that runs somewhere other than where
    # the download is produced is not a gate on the download.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version && cargo --version

      - name: Install what the tools shell out to
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep tmux

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # No `cargo fmt` here -- formatting is identical on every platform
      # and the macOS job already checks it. clippy and the tests are not
      # identical: the defect P12 found (a timeout that killed only the
      # process leader, because dash forks where bash execs) was green on
      # macOS and 10 seconds late on Linux, five times out of five.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The failure goes into the job summary *and* an annotation, not just
      # the log. Reading a job log needs a token; an annotation comes back
      # from the public check-runs API and shows on the commit page. So
      # "which test went red on Linux" is answerable without a gh login --
      # which matters exactly when a red Linux job is the only thing
      # standing between you and a release. `cargo test` is fail-fast, so
      # the tail is the useful part.
      - name: Test
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee /tmp/test.log; then
            {
              echo '### `cargo test --workspace` failed on Linux'
              echo
              echo '```'
              tail -n 60 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # An annotation is one line: %0A is how a newline survives.
            msg=$(tail -n 40 /tmp/test.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=cargo test --workspace failed::${msg}"
            exit 1
          fi

      # The Linux download is built by this script; a release is a bad
      # place to find out it does not run.
      - name: The release artifact builds and reports its version
        run: |
          bash scripts/dist-linux.sh
          dist/ccnm --version

  msrv:
    # One platform is enough while the only OS-gated code is
    # native::serve::marked_processes (/proc on Linux, `ps` elsewhere) and
    # no dependency is platform-specific. Add either and this needs
    # rethinking: the other platform's branch would never be compiled here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Read, not repeated here: when the three repositories bump
      # rust-version together, this job cannot be left testing the old one.
      - name: Install the toolchain Cargo.toml declares
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          case "$msrv" in
            ''|*[!0-9.]*)
              echo "::error::expected exactly one rust-version = \"x.y\" line in Cargo.toml, got: $msrv"
              exit 1 ;;
          esac
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      # A key of its own: stable's target/ is of no use to another rustc
      # and would only grow both caches.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-msrv-${{ runner.os }}-

      # toexec is a git dependency over https; the repository is public, so
      # this needs no token.
      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets --locked
