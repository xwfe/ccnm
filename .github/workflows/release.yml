# Cut a release from a tag.
#
#   git tag -a v0.1.0 -m "…" && git push origin v0.1.0
#
# What comes out is three downloads -- one universal macOS binary and one
# x86_64 Linux binary, each in a tarball, and one x86_64 Windows binary in a
# zip, each with its sha256 -- plus a GitHub release. The whole gate runs
# first, on every platform: a tag is not a reason to skip it, it is the
# reason to run it. On macOS and Linux that gate is the Rust one plus
# scripts/ci_gates.py (plan, protocol, the Python suite; P53), in the same
# step, before anything is built for upload; on Windows it is the CI
# windows-runtime job's, command for command -- tests/test_ci_gates.py fails
# if any of that stops being true.
#
# Windows carries only the Runtime half (P111): it is the machine holding
# the projects, never the AI machine. The other two are one per OS, and
# each carries both halves of ccnm. The Runtime
# half (`internal mcp-serve` and the seven tools) has run on Linux since
# P12 proved it on a real Debian 13 / x86_64 machine. The Agent half's
# Controller is a launchd LaunchAgent on macOS and, since P74 (v0.12.0),
# a systemd user service on Linux. How far each half has been proven on
# each OS is docs/support-matrix.md, not the release notes.
#
# The tag has to match the version in the binary. A `v0.1.1` tag on a tree
# that still says 0.1.0 would produce a download whose name lies about its
# contents, and that is the kind of thing nobody notices for months. Each
# build job checks its own binary, because only that runner can run it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    # macos-latest is arm64; the x86_64 half of the universal binary is
    # cross-compiled from it, which is what scripts/dist.sh does locally
    # too.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install what the tools shell out to
        run: brew install ripgrep tmux

      - name: Gate
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python3 scripts/ci_gates.py

      # `bash scripts/…` rather than `scripts/…`: the executable bit on
      # these two is not guaranteed (it was dropped once in a housekeeping
      # commit, and a release that fails on `Permission denied` fails
      # after the tag is already public and cannot be taken back).
      - name: Build the universal binary
        run: bash scripts/dist.sh

      - name: The tag and the binary must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(dist/ccnm --version | awk '{print $2}')
          if [ "$tag" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, the binary says $built" >&2
            echo "bump version in Cargo.toml, or tag the right commit" >&2
            exit 1
          fi
          echo "$GITHUB_REF_NAME == ccnm $built"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  linux:
    # Pinned, not `ubuntu-latest`: the runner's glibc is the floor of what
    # the download will start on, and that number must not move because
    # GitHub rolled the label forward.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      glibc: ${{ steps.build.outputs.glibc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Install what the tools shell out to
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep tmux

      # No `cargo fmt` here: formatting is the same on every platform and
      # the macOS job already ran it. clippy and the tests are not -- the
      # one defect P12 found on Linux (a timeout that only killed the
      # process leader) was invisible on macOS, which is the whole reason
      # this job exists.
      - name: Gate
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python3 scripts/ci_gates.py

      - name: Build the Linux binary
        id: build
        run: |
          bash scripts/dist-linux.sh
          echo "glibc=$(cat dist/glibc-floor.txt)" >> "$GITHUB_OUTPUT"

      - name: The tag and the binary must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(dist/ccnm --version | awk '{print $2}')
          if [ "$tag" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, the binary says $built" >&2
            echo "bump version in Cargo.toml, or tag the right commit" >&2
            exit 1
          fi
          echo "$GITHUB_REF_NAME == ccnm $built"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows:
    # The Runtime half only (P106–P112). Its gate is the CI windows-runtime
    # job's commands, not the Rust and Python suite the other two run: most
    # of the tests and scripts/ci_gates.py still assume Unix, and what runs
    # on Windows is listed in ci.yml a stage at a time. tests/test_ci_gates.py
    # holds the two lists equal.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Install what the tools shell out to
        run: |
          choco install ripgrep -y --no-progress
          rg --version

      - name: Gate
        run: |
          cargo clippy --workspace --lib --bins -- -D warnings
          cargo test -p ccnm-core --lib -- ssh:: protocol:: error:: lang:: \
            platform:: paths::remote:: mcp::path:: mcp::search::hit_paths:: safety::whoami:: \
            safety::windows:: safety::credentials::windows_tests:: \
            mcp::write_guard:: mcp::patch::
          cargo test -p ccnm-cli --test windows_gate
          cargo test -p ccnm-cli --test windows_doctor -- --nocapture
          cargo test -p ccnm-cli --test read_tools
          cargo test -p ccnm-cli --test write_guard
          cargo test -p ccnm-cli --test windows_exec -- --nocapture --test-threads=1

      - name: Build the Windows download
        run: bash scripts/dist-windows.sh

      - name: The tag and the binary must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(dist/ccnm.exe --version | awk '{print $2}' | tr -d '\r')
          if [ "$tag" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, the binary says $built" >&2
            echo "bump version in Cargo.toml, or tag the right commit" >&2
            exit 1
          fi
          echo "$GITHUB_REF_NAME == ccnm $built"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    # Only after every gate is green. One release, three downloads: a
    # release that appears while another platform is still building would
    # be a release somebody downloads part of.
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      # 为了拿 tag 自己的说明。`git tag -a` 写的那段话只存在 tag 对象里，
      # GitHub 的 release 页面不会显示它——不捞出来的话，每个版本的页面
      # 都是下面那段一模一样的安装说明，升级的人看不到这版改了什么。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GLIBC: ${{ needs.linux.outputs.glibc }}
        run: |
          ls -l downloads/macos downloads/linux downloads/windows
          # printf rather than a heredoc: a heredoc terminator indented to
          # match the YAML never terminates, and the failure is baffling.
          printf '%s\n' \
            'Three downloads, one per OS. The macOS and Linux binaries carry both halves' \
            'of ccnm; the Windows one carries only the project machine half.' \
            '' \
            '* `macos-universal` — arm64 + x86_64. Works as an **Agent Node** (the' \
            '  Controller is a launchd LaunchAgent) and as a **Runtime Node**.' \
            "* \`linux-x86_64\` — works as a **Runtime Node**, and from v0.12.0 on also" \
            '  as an **Agent Node** (the Controller is a systemd user service; needs' \
            "  systemd and tmux). Needs glibc >= $GLIBC; Debian 13 has 2.41." \
            '* `windows-x86_64` — a **Runtime Node** only: the machine holding the' \
            '  projects, reached through the OpenSSH Server that comes with Windows. The AI machine' \
            '  stays macOS or Linux. Setup: docs/windows-runtime-setup.md.' \
            '' \
            'Both machines need the same ccnm version -- including the copy the' \
            'execution account runs (your own account by default; the `runtime_user`,' \
            'e.g. `ccrun`, if the Runtime names one). Upgrading: stop' \
            'every session first, and after replacing the binary on the Agent Node' \
            'run `ccnm controller install` there, or the old Controller keeps' \
            'running. Full steps and rollback: docs/operations.md.' \
            '' \
            'Take the one for that machine -- a glob here would match more than one:' \
            '' \
            '```' \
            'tar -xzf ccnm-<version>-<platform>.tar.gz' \
            'mv ccnm ~/.local/bin/ccnm.new && mv ~/.local/bin/ccnm.new ~/.local/bin/ccnm' \
            '```' \
            '' \
            'On Windows, unpack the zip into `%USERPROFILE%\.local\bin` and give the AI' \
            'machine that full path as `ccnm_bin`, with forward slashes and `.exe`;' \
            'docs/windows-runtime-setup.md has every step.' \
            '' \
            'Two things that bite on macOS and Linux:' \
            '' \
            '* Never `cp` over a ccnm that has already run. On Apple Silicon the next' \
            '  exec of it dies with SIGKILL (exit 137) while the running one carries on' \
            '  with the old code. Rename over it, as above.' \
            '* Downloaded through a browser it arrives quarantined and macOS refuses to' \
            '  run it: `xattr -d com.apple.quarantine ccnm`. `curl` does not set that.' \
            '' \
            'Setup, the doctor table and troubleshooting: README.md' > install.md
          # tag 自己那段话在前，安装说明在后。`%(contents)` 的第一行是 tag 名
          # （历史上每个 tag 都这么写的），删掉它免得和 release 标题重复。
          # 拿不到就只发安装说明——发版不能因为少一段说明而失败。
          #
          # 先把 tag 对象取回来：actions/checkout 在 tag 触发时建的是**轻量**
          # tag（直接指向提交），这种 tag 的 `%(contents)` 给的是**提交说明**，
          # 不是 `git tag -a` 写的那段。v0.9.0 的 release 页就这么错了一次：
          # 正文成了最后一条 docs 提交的说明。所以显式 fetch 这个 ref，并且只在
          # 它确实是 tag 对象时才读正文——读不到宁可只发安装说明。
          git fetch --force --no-recurse-submodules origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME" 2>/dev/null)" = tag ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" \
              | tail -n +2 > tagnotes.md || true
          fi
          if [ -s tagnotes.md ]; then
            cat tagnotes.md > notes.md
            printf '\n---\n\n' >> notes.md
            cat install.md >> notes.md
          else
            echo "::warning::tag $GITHUB_REF_NAME 没有 annotation、或者 tag 对象取不回来，release 只带安装说明"
            cp install.md notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            downloads/macos/* downloads/linux/* downloads/windows/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ccnm $GITHUB_REF_NAME" \
            --notes "$(cat notes.md)"
