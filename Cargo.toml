[workspace]
resolver = "3"
members = ["crates/ccnm-cli", "crates/ccnm-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 for `File::try_lock`, which is how `apply_patch` tells an
# interrupted commit from one that is still running. The alternative was a
# timeout, and a timeout was wrong in both directions: it left a window in
# which an interruption was invisible, and it read a clock, so an NTP step
# could announce one that never happened.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/xwfe/ccnm"

[workspace.dependencies]
ccnm-core = { path = "crates/ccnm-core" }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Editing config.toml in place. `toml` can parse and serialize; only
# toml_edit keeps the file someone wrote -- their comments, their order,
# their spacing -- when ccnm adds a workspace to it. Rewriting a config
# from a struct would silently delete whatever they had explained to
# themselves in there.
toml_edit = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
# MCP: the official Rust SDK, trimmed to stdio server + child-process
# client. It needs tokio; nothing outside crates/ccnm-core/src/mcp is
# async (design doc section 25).
rmcp = { version = "3.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "client",
    "transport-child-process",
] }
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "process", "time"] }

[workspace.lints.rust]
# ccnm handles paths, hashes and JSON from another machine. Nothing here needs
# unsafe; forbidding it keeps that true when the crate grows.
unsafe_code = "forbid"
