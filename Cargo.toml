[workspace]
resolver = "3"
members = ["crates/ccnm-cli", "crates/ccnm-core", "crates/ccnm-testdir"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# 1.89 for `File::try_lock`, which is how `apply_patch` tells an
# interrupted commit from one that is still running. The alternative was a
# timeout, and a timeout was wrong in both directions: it left a window in
# which an interruption was invisible, and it read a clock, so an NTP step
# could announce one that never happened.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/xwfe/ccnm"

[workspace.dependencies]
ccnm-core = { path = "crates/ccnm-core" }
# Test-only (dev-dependency): scratch directories that delete themselves.
ccnm-testdir = { path = "crates/ccnm-testdir" }
# 跟 gld 共用的文本读取原语（跨仓计划 toexec 的 V2-K）。
#
# 按 tag 固定，不跟着 main 走：共享库改了不会在某次 `cargo update` 之后
# 突然改变这里的行为。升级是一次显式的改动——在那边发新 tag，再改这一行。
# 用 https 而不是 ssh，是因为 toexec 是公开仓库，匿名就能读，本地和 CI
# 都不需要配凭据。本地开发那边的源码时，用 `cargo add --path` 或临时改成
# path 依赖，**别提交**——提交了 CI 就又拉不到了。
toexec-text = { git = "https://github.com/xwfe/toexec.git", tag = "toexec-text-v0.1.0" }
# 同一个仓库的第二个 crate：原子文件替换。tag 各自独立，所以升级一个
# 不会顺带把另一个也换掉。
toexec-fs = { git = "https://github.com/xwfe/toexec.git", tag = "toexec-fs-v0.2.1" }
# 第三个：读 SKILL.md（frontmatter、参数替换、注入命令识别）。P36 的项目 skills
# 用它；gld 原来自己的读法不认多行 description，也会换过来。
toexec-skill = { git = "https://github.com/xwfe/toexec.git", tag = "toexec-skill-v0.1.0" }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Editing config.toml in place. `toml` can parse and serialize; only
# toml_edit keeps the file someone wrote -- their comments, their order,
# their spacing -- when ccnm adds a workspace to it. Rewriting a config
# from a struct would silently delete whatever they had explained to
# themselves in there.
toml_edit = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
# MCP: the official Rust SDK, trimmed to stdio server + child-process
# client. It needs tokio; nothing outside crates/ccnm-core/src/mcp is
# async (design doc section 25).
rmcp = { version = "3.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "client",
    "transport-child-process",
] }
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "process", "time"] }

[workspace.lints.rust]
# ccnm handles paths, hashes and JSON from another machine. Nothing here needs
# unsafe; forbidding it keeps that true when the crate grows.
unsafe_code = "forbid"
