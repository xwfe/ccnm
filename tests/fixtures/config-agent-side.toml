# What `ccnm init --runtime <alias>` writes on an Agent Node: how to reach
# the projects, and deliberately nothing about them. The workspace list
# lives on one node, because two lists are two answers to "where is this
# project".
this = "agent"
runtime_node = "runtime"

[nodes.agent]

[nodes.runtime]
ssh = "no-such-host-for-tests"
