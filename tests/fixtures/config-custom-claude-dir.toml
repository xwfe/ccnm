# Every optional field set: opt-in CLAUDE_CONFIG_DIR (design doc section
# 21), explicit ccnm paths on both hosts (section 7), a runtime host under
# a non-default name, and the backend spelled out.
version = 1

[nodes.agent]
ssh_from_runtime = "work"
ccnm_bin = "/Users/me/bin/ccnm"
claude_config_dir = "/Users/me/.ccnm/claude"

[nodes.runtime]
ssh_from_agent = "home"
ccnm_bin = "/Users/ccrun/.local/bin/ccnm"

[workspaces.xshun]
backend = "mcp-ssh"
agent_node = "agent"
runtime_node = "runtime"
root = "/Users/ccrun/Projects/xshun"
claude_permission_mode = "acceptEdits"
