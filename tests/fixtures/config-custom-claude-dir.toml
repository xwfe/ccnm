# Opt-in custom CLAUDE_CONFIG_DIR (design doc section 10) and every
# optional workspace field left at its default.
version = 1

[hosts.work]
ssh = "work"
claude_config_dir = "/Users/me/.ccnm/claude"

[workspaces.xshun]
work_host = "work"
root = "/Users/Shared/cc-workspaces/xshun"
runtime_root = "/Users/Shared/cc-runtime/xshun"
share = "xshun"
