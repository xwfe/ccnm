# The SMB Hybrid fallback (appendix A.2). Parses, but this build does not
# implement the backend; doctor says so instead of pretending.
version = 1

[hosts.work]
ssh = "work"

[hosts.home]
ssh_from_work = "ccnm-home"
smb_user = "fodelf"

[workspaces.legacy]
backend = "hybrid-smb"
work_host = "work"
runtime_host = "home"
root = "/Users/Shared/cc-workspaces/legacy"
runtime_root = "/Users/Shared/cc-runtime/legacy"
share = "legacy"
mount_mode = "coherence"
